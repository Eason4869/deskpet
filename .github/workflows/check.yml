name: Windows checks
on:
  push:
    branches: [main, dev, codex/macos-0.6.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and run tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failedTargets = @()
          foreach ($target in @('ConversationWorkspaceManagerTests','ImageGenerationTaskStoreTests','ImageGenerationTaskManagerTests','ImageGenerationMotionTests','GeneratedImageGroupTests','ImageGalleryManagementTests','ImageGalleryExportTests','ImageTaskCenterLifecycleTests','ImageTaskCenterUiTests','ImageGenerationBackendTests','ImageProviderProtocolTests','ImageGalleryLayoutTests','ImageGenerationIntegrationTests','ImageGenerationUiTests','AgentProjectToolsTests','AgentQuestionUiSmoke','LanServiceTests','LanSettingsUiTests','ThemeTests','ContextPreviewTests','LiveWaveformTests','ReleaseIdentityTests','UpdateChannelTests','ReleaseVersionTests','WindowsTerminalTests','WorkspaceSandboxTests','BrowserProfileCleanupTests','ManualRunTests','GuideBookendTests','PopupLifecycleTests','AppShellTests','PluginsUiTests','ManagedSkillLibraryTests','SkillRepositoryTests','SkillDiscoveryUiTests','UsageTrackingTests','UsageStatisticsUiTests','EmbeddedSettingsTests','ChatImagePreviewTests','ShortcutHelpTests','TrayInteractionTests','ChangeSummaryPersistenceTests','ChangeSummaryIntegrationTests','ConversationViewportTests','UnifiedWorkspaceTests','UnifiedPreviewTabsTests','SidebarWorkspaceTests','SummaryNavigationTests','SideChatTests','BrowserPaneTests','TerminalUiTests','FilePreviewTests','ProcessAvatarTests','ChatAtmosphereTests','FinalOutputFilesTests','WorkspacePermissionTests','PermissionUiSmoke','ConversationArchiveRegressionTests','ConversationSwitchRegressionTests','PetRuntimeTests','AgentEvolutionRegressionTests','ComposerSmoke','AgentCapabilityTests','AgentApprovalTests','AgentApprovalUiSmoke','AgentTerminalTests','AgentIsolationTests','AgentCodingWorkflowTests','AgentContextPolicyTests','AgentInstructionTests','McpConnectionTests','McpUiSmoke','AgentTaskRunnerTests','AgentSubagentExecutionTests','AgentRunRecoveryTests','AgentTaskMemoryTests','GuidanceUiTests','ComposerRenderingTests','DeleteDialogTests','UiResourceTests','QueueHandleTests','ConversationVisualTests','ConversationOwnershipUiTests','WelcomeSuggestionTests','DetailedGuideTests','ConversationModeUiTests','ConversationOwnershipTests','CoreTests','ProfileTests','ApiTests','ConversationTests','HistoryTests','StreamingTests','VoicePresetTests','LiveTests','UpdateTests','UpdateApplyTests','GreetingTests','StartupTests','ProxyTests','QueueTests','DictationTests','InteractionTests','SpriteAlignmentTests','ProviderTests','OnboardingModelSmoke','ImportedSkinTests','AiGreetingTests','BundledSkinTests','OnboardingUpgradeTests','RecorderFailureTests','UpdateScheduleTests','MarkdownTests','AgentWorkspaceTests','AgentProtocolTests','AgentSessionTests','WorkSettingsTests','DevReviewRegressionTests','SidebarSectionsTests','DraftConversationTests','ComposerPaletteTests','ContextUsageTests','ModelConfigurationSmoke','SettingsMaximizeTests','SidebarProjectInteractionTests','SidebarActionTests','ConversationUiSmoke','ApplicationSnapshotTests','AgentReliabilityTests','AgentFileToolsTests','AgentChangesTests','AgentDocumentTests','AgentCommandTests','AgentTaskTests','AgentWorkbenchSmoke','AgentContextTests','PredictionTests','SteeringSmoke')) {
            try {
              if ($target -eq 'PredictionTests') { & .\Build.ps1 -Target $target -TestArguments '--ui' } else { & .\Build.ps1 -Target $target }
              if ($LASTEXITCODE -ne 0) { throw "Failed: $target" }
            } catch {
              $failedTargets += $target
              Write-Output ("FAIL " + $target + ": " + $_.Exception.Message)
            }
          }
          if ($failedTargets.Count -gt 0) { throw ("Failed targets: " + ($failedTargets -join ', ')) }
      - name: Compile application
        shell: powershell
        run: .\Build.ps1 -Target App -OutputDirectory work/dev3-ci-package/DafeiyuDeskPet
      - name: Verify release archive can be applied by the updater
        shell: powershell
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python tests/RuntimePackageTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime staging checks failed' }
          python tests/ReleaseAssetTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Release asset naming checks failed' }
          python tests/WindowsReleaseTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication guard checks failed' }
          python tests/PackagingSmoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Release archive verification failed' }
      - name: Check image regression registration
        shell: powershell
        run: |
          python tests/ImageWorkflowRegistrationTests.py
          if ($LASTEXITCODE) { throw 'Image registration checks failed' }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json
      - name: Avalonia UI and separate native quit routes
        shell: powershell
        run: |
          dotnet restore desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj
          if ($LASTEXITCODE) { throw 'Desktop restore failed' }
          dotnet build desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj -c Release -m:1 --no-restore
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
          $testDll = 'desktop/DeskPet.Desktop.Tests/bin/Release/net10.0/DeskPet.Desktop.Tests.dll'
          foreach ($arguments in @('', '--image-writer-exit-ui-only', '--image-held-exit-ui-only', '--image-exit-ui-only')) {
            if ($arguments) { dotnet $testDll $arguments } else { dotnet $testDll }
            if ($LASTEXITCODE) { throw ('Desktop acceptance failed: ' + $arguments) }
          }
      - name: Pre-tag Windows installer preflight
        shell: powershell
        run: |
          .\BuildInstaller.ps1 -OutputDirectory work/dev3-ci-package
          if ($LASTEXITCODE) { throw 'Installer preflight failed' }
