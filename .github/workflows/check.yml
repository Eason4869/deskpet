name: Windows checks
on:
  push:
    branches: [main, dev, codex/macos-0.6.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Chinese resources
        shell: powershell
        run: |
          python tests/LocalizationAuditTests.py
          if ($LASTEXITCODE) { throw 'Localization audit regression failed' }
          python tools/verify_localization.py check --phase complete --report work/localization-audit.json
          if ($LASTEXITCODE) { throw 'Localization completeness failed' }
      - name: Build and run tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failedTargets = @()
          foreach ($target in @('AgentJobContractTests','AgentJobStoreTests','AgentJobLogTests','AgentJobManagerTests','LocalizationTests','LocalizationMissingResourceTests','LocalizationUiTests','CompanionStartupTests','PowerShellStartupTests','OfficialCompanionLegacyTests','OfficialCompanionIdentityTests','HolidaySourceBindingTests','OfficialCompanionTests','ConversationArchiveRegressionTests','HolidayAssetTests','HolidayProductionSmoke','HolidayRuntimeTests','HolidayHoverTests','HolidayIdentityTests','HolidayVisualSmoke','HolidaySettingsSmoke','HolidayGreetingTests','HolidayCalendarTests','HolidayStateTests','ConversationWorkspaceManagerTests','ImageGenerationTaskStoreTests','ImageGenerationTaskManagerTests','ImageGenerationMotionTests','GeneratedImageGroupTests','ImageGalleryManagementTests','ImageGalleryExportTests','ImageTaskCenterLifecycleTests','ImageTaskCenterUiTests','ImageGenerationBackendTests','ImageProviderProtocolTests','ImageGalleryLayoutTests','ImageGenerationIntegrationTests','ImageGenerationUiTests','AgentProjectToolsTests','AgentQuestionUiSmoke','LanServiceTests','LanSettingsUiTests','ThemeTests','ContextPreviewTests','LiveWaveformTests','ReleaseIdentityTests','UpdateChannelTests','ReleaseVersionTests','WindowsTerminalTests','WorkspaceSandboxTests','BrowserProfileCleanupTests','ManualRunTests','GuideBookendTests','PopupLifecycleTests','AppShellTests','PluginsUiTests','ManagedSkillLibraryTests','SkillRepositoryTests','SkillDiscoveryUiTests','UsageTrackingTests','UsageStatisticsUiTests','EmbeddedSettingsTests','ChatImagePreviewTests','ShortcutHelpTests','TrayInteractionTests','ChangeSummaryPersistenceTests','ChangeSummaryIntegrationTests','ConversationViewportTests','UnifiedWorkspaceTests','UnifiedPreviewTabsTests','SidebarWorkspaceTests','SummaryNavigationTests','SideChatTests','BrowserPaneTests','TerminalUiTests','FilePreviewTests','ProcessAvatarTests','ChatAtmosphereTests','FinalOutputFilesTests','WorkspacePermissionTests','PermissionUiSmoke','ConversationSwitchRegressionTests','PetRuntimeTests','AgentEvolutionRegressionTests','ComposerSmoke','AgentCapabilityTests','AgentApprovalTests','AgentApprovalUiSmoke','AgentTerminalTests','AgentIsolationTests','AgentCodingWorkflowTests','AgentContextPolicyTests','AgentInstructionTests','McpConnectionTests','McpUiSmoke','AgentTaskRunnerTests','AgentSubagentExecutionTests','AgentRunRecoveryTests','AgentTaskMemoryTests','GuidanceUiTests','ComposerRenderingTests','DeleteDialogTests','UiResourceTests','QueueHandleTests','ConversationVisualTests','ConversationOwnershipUiTests','WelcomeSuggestionTests','DetailedGuideTests','ConversationModeUiTests','ConversationOwnershipTests','CoreTests','ProfileTests','ApiTests','ConversationTests','HistoryTests','StreamingTests','VoicePresetTests','LiveTests','UpdateTests','UpdateApplyTests','GreetingTests','StartupTests','ProxyTests','QueueTests','DictationTests','InteractionTests','SpriteAlignmentTests','ProviderTests','OnboardingModelSmoke','ImportedSkinTests','AiGreetingTests','BundledSkinTests','OnboardingUpgradeTests','RecorderFailureTests','UpdateScheduleTests','MarkdownTests','AgentWorkspaceTests','AgentProtocolTests','AgentSessionTests','WorkSettingsTests','DevReviewRegressionTests','SidebarSectionsTests','DraftConversationTests','ComposerPaletteTests','ContextUsageTests','ModelConfigurationSmoke','SettingsMaximizeTests','SidebarProjectInteractionTests','SidebarActionTests','ConversationUiSmoke','ApplicationSnapshotTests','AgentReliabilityTests','AgentFileToolsTests','AgentChangesTests','AgentDocumentTests','AgentCommandTests','AgentTaskTests','AgentWorkbenchSmoke','AgentContextTests','PredictionTests','SteeringSmoke')) {
            try {
              if ($target -eq 'PredictionTests') { & .\Build.ps1 -Target $target -TestArguments '--ui' } else { & .\Build.ps1 -Target $target }
              if ($LASTEXITCODE -ne 0) { throw "Failed: $target" }
            } catch {
              $failedTargets += $target
              Write-Output ("FAIL " + $target + ": " + $_.Exception.Message)
            }
          }
          if ($failedTargets.Count -gt 0) { throw ("Failed targets: " + ($failedTargets -join ', ')) }
      - name: Verify native background jobs and AppContainer ownership
        shell: powershell
        run: |
          foreach ($target in @('AgentJobToolTests', 'AgentJobIntegrationTests', 'AgentJobSessionTests', 'AgentJobProcessTests', 'AgentJobSandboxTests')) {
            & ./Build.ps1 -Target $target
            if ($LASTEXITCODE) { throw ('Native background job checks failed: ' + $target) }
          }
          & ./Build.ps1 -Target AgentJobProcessTests -TestArguments '--resources-only'
          if ($LASTEXITCODE) { throw 'Framework native resource checks failed (P1)' }
      - name: Verify thin WPF companion download and restoration integration
        shell: powershell
        run: |
          & ./Build.ps1 -Target WpfOfficialCompanionTests -TestArguments @('--thin-ui', ('--legacy-assets=' + (Join-Path $PWD 'assets/bundled-skins')))
          if ($LASTEXITCODE) { throw 'Thin WPF companion acceptance failed' }
      - name: Compile application
        shell: powershell
        run: .\Build.ps1 -Target App -OutputDirectory work/dev3-ci-package/DafeiyuDeskPet
      - name: Verify standalone application and helper locale
        shell: powershell
        run: |
          ./tools/check_localization_artifacts.ps1 -AppRoot work/dev3-ci-package/DafeiyuDeskPet
          if ($LASTEXITCODE) { throw 'WPF locale artifact verification failed' }
      - name: Verify release archive can be applied by the updater
        shell: powershell
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python tests/HolidayAssetValidationTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Holiday asset validator checks failed' }
          python tools/validate_holiday_assets.py --report-json work/holiday-assets.json
          if ($LASTEXITCODE -ne 0) { throw 'Five complete holiday outfits are required' }
          python tools/generate_embedded_companion_catalog.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Embedded companion catalog is stale' }
          python tools/generate_legacy_companion_inventory.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Legacy companion inventory is stale' }
          python tests/CompanionReleaseTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Companion publication guard checks failed' }
          python tests/OfficialCompanionAuthoringTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Official companion authoring checks failed' }
          python tests/RuntimePackageTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime staging checks failed' }
          python tests/ReleaseAssetTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Release asset naming checks failed' }
          python tests/WindowsReleaseTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication guard checks failed' }
          python tests/PackagingSmoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Release archive verification failed' }
      - name: Check image regression registration
        shell: powershell
        run: |
          python tests/ImageWorkflowRegistrationTests.py
          if ($LASTEXITCODE) { throw 'Image registration checks failed' }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json
      - name: Avalonia UI and separate native quit routes
        shell: powershell
        run: |
          dotnet restore desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj
          if ($LASTEXITCODE) { throw 'Desktop restore failed' }
          dotnet build desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj -c Release -m:1 --no-restore
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
          $testDll = 'desktop/DeskPet.Desktop.Tests/bin/Release/net10.0/DeskPet.Desktop.Tests.dll'
          foreach ($arguments in @('', '--image-writer-exit-ui-only', '--image-held-exit-ui-only', '--image-exit-ui-only')) {
            if ($arguments) { dotnet $testDll $arguments } else { dotnet $testDll }
            if ($LASTEXITCODE) { throw ('Desktop acceptance failed: ' + $arguments) }
          }
          dotnet build desktop/DeskPet.Tests/DeskPet.Tests.csproj -c Release -m:1
          if ($LASTEXITCODE) { throw 'Shared business build failed' }
          dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --report-json work/localization-core-report.json
          if ($LASTEXITCODE) { throw 'Shared business regression failed' }
          dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --agent-job-tools-only
          if ($LASTEXITCODE) { throw '.NET background job tool integration failed' }
          dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --agent-job-session-only
          if ($LASTEXITCODE) { throw '.NET scripted native conversation checks failed' }
          dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --agent-jobs-native-only
          if ($LASTEXITCODE) { throw '.NET native background job checks failed' }
          dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --agent-jobs-resources-only
          if ($LASTEXITCODE) { throw '.NET native resource checks failed (P1)' }
          dotnet run --project tools/localization/VerifyArtifacts.csproj -c Release -- ((Get-FileHash assets/locales/zh_CN.json).Hash.ToLowerInvariant()) desktop/DeskPet.Desktop.Tests/bin/Release/net10.0/DeskPet.Core.dll
          if ($LASTEXITCODE) { throw 'Core locale artifact verification failed' }
      - name: Verify actual thin Avalonia companion resources and restoration
        shell: powershell
        run: |
          dotnet restore desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj --locked-mode --artifacts-path work/official-ava-thin -p:DeskPetFullResourceFixtures=false -m:1
          if ($LASTEXITCODE) { throw 'Thin desktop restore failed' }
          dotnet build desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj --no-restore -c Release --artifacts-path work/official-ava-thin -p:DeskPetFullResourceFixtures=false -p:BuildInParallel=false -m:1 -nr:false
          if ($LASTEXITCODE) { throw 'Thin desktop build failed' }
          dotnet work/official-ava-thin/bin/DeskPet.Desktop.Tests/release/DeskPet.Desktop.Tests.dll --official-thin-ui-only
          if ($LASTEXITCODE) { throw 'Thin desktop acceptance failed' }
      - name: Pre-tag Windows installer preflight
        shell: powershell
        run: |
          .\BuildInstaller.ps1 -OutputDirectory work/dev3-ci-package
          if ($LASTEXITCODE) { throw 'Installer preflight failed' }
      - name: Verify locale in the actually installed application
        shell: powershell
        run: |
          $setup = @(Get-ChildItem work/dev3-ci-package/DeskPet-Windows-Setup-*.exe)
          if ($setup.Count -ne 1) { throw 'Expected one verified installer' }
          $destination = Join-Path $PWD 'work/localization-installed'
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="'+$destination+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode) { throw 'Isolated installer acceptance failed' }
          $log = Join-Path $PWD 'work/localization-installed.log'
          ./tools/check_localization_artifacts.ps1 -AppRoot $destination | Tee-Object -FilePath $log
          if ($LASTEXITCODE) { throw 'Installed locale acceptance failed' }
      - name: Preserve localization acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-acceptance-windows-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            work/localization-audit.json
            work/localization-core-report.json
            work/localization-installed.log
      - name: Preserve failed native link test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-link-input-diagnostics
          if-no-files-found: ignore
          path: |
            work/permissions/link-right-click-hit.png
            work/permissions/link-native-input-not-ready.png
            work/permissions/link-navigation-failure.png
            work/permissions/link-navigation-failure.txt
            work/image-ui-evidence/generation-layout-failure.png
            work/image-ui-evidence/generation-layout-failure.txt
            work/image-ui-evidence/gallery-toolbar-failure.png
            work/image-ui-evidence/gallery-toolbar-failure.txt
