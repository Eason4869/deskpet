name: Windows checks
on:
  push:
    branches: [main, dev, codex/macos-0.6.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and run tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failedTargets = @()
          foreach ($target in @('ThemeTests','ContextPreviewTests','LiveWaveformTests','ReleaseIdentityTests','UpdateChannelTests','ReleaseVersionTests','WindowsTerminalTests','WorkspaceSandboxTests','BrowserProfileCleanupTests','ManualRunTests','GuideBookendTests','PopupLifecycleTests','AppShellTests','PluginsUiTests','ManagedSkillLibraryTests','UsageTrackingTests','UsageStatisticsUiTests','EmbeddedSettingsTests','ChatImagePreviewTests','ShortcutHelpTests','TrayInteractionTests','ChangeSummaryPersistenceTests','ChangeSummaryIntegrationTests','ConversationViewportTests','UnifiedWorkspaceTests','UnifiedPreviewTabsTests','SidebarWorkspaceTests','SummaryNavigationTests','SideChatTests','BrowserPaneTests','TerminalUiTests','FilePreviewTests','ProcessAvatarTests','ChatAtmosphereTests','FinalOutputFilesTests','WorkspacePermissionTests','PermissionUiSmoke','ConversationSwitchRegressionTests','PetRuntimeTests','AgentEvolutionRegressionTests','ComposerSmoke','AgentCapabilityTests','AgentApprovalTests','AgentApprovalUiSmoke','AgentTerminalTests','AgentIsolationTests','AgentCodingWorkflowTests','AgentContextPolicyTests','AgentInstructionTests','McpConnectionTests','McpUiSmoke','AgentTaskRunnerTests','AgentSubagentExecutionTests','AgentRunRecoveryTests','AgentTaskMemoryTests','GuidanceUiTests','ComposerRenderingTests','DeleteDialogTests','UiResourceTests','QueueHandleTests','ConversationVisualTests','ConversationOwnershipUiTests','WelcomeSuggestionTests','DetailedGuideTests','ConversationModeUiTests','ConversationOwnershipTests','CoreTests','ProfileTests','ApiTests','ConversationTests','HistoryTests','StreamingTests','VoicePresetTests','LiveTests','UpdateTests','UpdateApplyTests','GreetingTests','StartupTests','ProxyTests','QueueTests','DictationTests','InteractionTests','SpriteAlignmentTests','ProviderTests','OnboardingModelSmoke','ImportedSkinTests','AiGreetingTests','BundledSkinTests','OnboardingUpgradeTests','RecorderFailureTests','UpdateScheduleTests','MarkdownTests','AgentWorkspaceTests','AgentProtocolTests','AgentSessionTests','WorkSettingsTests','DevReviewRegressionTests','SidebarSectionsTests','DraftConversationTests','ComposerPaletteTests','ContextUsageTests','ModelConfigurationSmoke','SettingsMaximizeTests','SidebarProjectInteractionTests','SidebarActionTests','ConversationUiSmoke','ApplicationSnapshotTests','AgentReliabilityTests','AgentFileToolsTests','AgentChangesTests','AgentDocumentTests','AgentCommandTests','AgentTaskTests','AgentWorkbenchSmoke','AgentContextTests','PredictionTests','SteeringSmoke')) {
            try {
              if ($target -eq 'PredictionTests') { & .\Build.ps1 -Target $target -TestArguments '--ui' } else { & .\Build.ps1 -Target $target }
              if ($LASTEXITCODE -ne 0) { throw "Failed: $target" }
            } catch {
              $failedTargets += $target
              Write-Output ("FAIL " + $target + ": " + $_.Exception.Message)
            }
          }
          if ($failedTargets.Count -gt 0) { throw ("Failed targets: " + ($failedTargets -join ', ')) }
      - name: Compile application
        shell: powershell
        run: .\Build.ps1 -Target App
      - name: Verify release archive can be applied by the updater
        shell: powershell
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python tests/RuntimePackageTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime staging checks failed' }
          python tests/ReleaseAssetTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Release asset naming checks failed' }
          python tests/WindowsReleaseTests.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication guard checks failed' }
          python tests/PackagingSmoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Release archive verification failed' }
