name: Complete companion import
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'desktop/**', 'tools/build_official_companions.py', 'assets/official/**', 'assets/holidays/**', 'assets/complete-defaults/**', '.github/workflows/complete-companions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Complete package policy and inventory
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --complete-companion-only
      - name: Seasonal boundaries and independent unlocks
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --seasonal-integration-only
      - name: Reviewed complete fixture and original default bytes
        run: python tests/CompleteCompanionFixtureTests.py
      - name: Existing official download and atomic publication
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --official-companion-only
      - name: Existing source binding
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --holiday-source-only
      - name: Native Windows package policy
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build.ps1 -Target CompleteCompanionTests
      - name: All fifty native outfits and bounded repeated wardrobe cache
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build.ps1 -Target CompleteCompanionNativeTests
      - name: Holiday action clocks preserve all poses
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build.ps1 -Target CompleteCompanionClockTests
      - name: Encrypted drafts and ten reviewed keepsake sets
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --dev3-features-only
      - name: All fifty native Avalonia action clocks
        run: dotnet run --project desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj -p:BuildInParallel=false -- --complete-companions
      - name: Installed local wardrobe restart and source isolation
        run: dotnet run --project desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj --no-build -- --complete-local-only
      - name: Native Windows card exports, draft restart and key capture
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./Build.ps1 -Target SeasonalKeepsakeUiTests
          if ($LASTEXITCODE) { throw 'Card exports failed' }
          ./Build.ps1 -Target DraftConversationTests
          if ($LASTEXITCODE) { throw 'Draft restart failed' }
          ./Build.ps1 -Target ShortcutCaptureUiTests
          if ($LASTEXITCODE) { throw 'Key capture failed' }
          ./Build.ps1 -Target LocalImportUiTests
          if ($LASTEXITCODE) { throw 'Import cancellation failed' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: dev3-native-cards
          path: work/festive-scenes/native-cards
          if-no-files-found: ignore
