name: Complete companion import
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'desktop/**', 'tools/build_official_companions.py', 'assets/official/**', 'assets/holidays/**', 'assets/complete-defaults/**', '.github/workflows/complete-companions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Complete package policy and inventory
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --complete-companion-only
      - name: Seasonal boundaries and independent unlocks
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --seasonal-integration-only
      - name: Reviewed complete fixture and original default bytes
        run: python tests/CompleteCompanionFixtureTests.py
      - name: Existing official download and atomic publication
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --official-companion-only
      - name: Existing source binding
        run: dotnet run --project desktop/DeskPet.Tests/DeskPet.Tests.csproj -- --holiday-source-only
      - name: Native Windows package policy
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build.ps1 -Target CompleteCompanionTests
      - name: All fifty native outfits and bounded repeated wardrobe cache
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build.ps1 -Target CompleteCompanionNativeTests
      - name: Holiday action clocks preserve all poses
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build.ps1 -Target CompleteCompanionClockTests
