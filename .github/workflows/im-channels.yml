name: Messaging channel checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'assets/locales/**'
      - 'vendor/qrcoder/**'
      - 'docs/im-channels*'
      - 'tests/**'
      - 'tools/runtime_package.py'
      - 'templates/runtime-readme*'
      - '.github/workflows/im-channels.yml'
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  channels:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build protocol and lifecycle tests
        run: dotnet build desktop/DeskPet.Tests/DeskPet.Tests.csproj -c Release -m:1 -nr:false
      - name: Protocol, cancellation, authorization and translations
        run: dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --im-channels-only
      - name: Language resource contracts
        run: python tools/verify_language_packs.py
      - name: Runtime guide packaging
        run: python tests/RuntimePackageTests.py
      - name: Build desktop fixtures
        run: dotnet build desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj -c Release -m:1 -nr:false -p:DeskPetFullResourceFixtures=false
      - name: Native controls and all thirteen locales
        run: dotnet desktop/DeskPet.Desktop.Tests/bin/Release/net10.0/DeskPet.Desktop.Tests.dll --im-channels-ui-all-locales
      - name: WPF controls, local QR and route roundtrip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./Build.ps1 -Target ImChannelUiTests
          if ($LASTEXITCODE) { throw 'WPF messaging checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messaging-ui-${{ matrix.os }}
          path: |
            work/im-ui-*/channels*.png
            work/feature-navigation/native-*/channels*.png
          if-no-files-found: ignore
