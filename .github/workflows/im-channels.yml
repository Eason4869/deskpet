name: Messaging channel checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'assets/locales/**'
      - 'assets/im-logos.LICENSE.txt'
      - 'docs/third-party-notices.md'
      - 'vendor/qrcoder/**'
      - 'docs/im-channels*'
      - 'tests/**'
      - 'tools/runtime_package.py'
      - 'tools/prepare_bundled_ebao.py'
      - 'tools/build_official_companions.py'
      - 'assets/complete-defaults/**'
      - 'assets/official/**'
      - 'assets/holidays/**'
      - 'templates/runtime-readme*'
      - '.github/workflows/im-channels.yml'
      - '.github/workflows/bundled-ebao.yml'
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    uses: ./.github/workflows/bundled-ebao.yml
  channels:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build protocol and lifecycle tests
        run: dotnet build desktop/DeskPet.Tests/DeskPet.Tests.csproj -c Release -m:1 -nr:false
      - name: Protocol, cancellation, authorization and translations
        run: dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --im-channels-only
      - name: Official bot registration and credential decryption
        run: dotnet desktop/DeskPet.Tests/bin/Release/net10.0/DeskPet.Tests.dll --im-registration-only
      - name: Language resource contracts
        run: python tools/verify_language_packs.py
      - name: Runtime guide packaging
        run: python tests/RuntimePackageTests.py
      - uses: actions/download-artifact@v6
        with:
          name: pinned-ebao-${{ github.sha }}
          path: work/messaging-bundle-input
      - name: Verify the Windows-authored bundle before native UI compilation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow
          python -X utf8 tools/prepare_bundled_ebao.py --package work/messaging-bundle-input/e-bao.zip
      - name: Build desktop fixtures
        run: dotnet build desktop/DeskPet.Desktop.Tests/DeskPet.Desktop.Tests.csproj -c Release -m:1 -nr:false -p:DeskPetFullResourceFixtures=false
      - name: Native controls and all thirteen locales
        run: dotnet desktop/DeskPet.Desktop.Tests/bin/Release/net10.0/DeskPet.Desktop.Tests.dll --im-channels-ui-all-locales
      - name: WPF controls, local QR and route roundtrip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($target in @('ImChannelTests','FeishuRegistrationTests','OfficialBotRegistrationTests','WecomRegistrationTests','ImChannelUiTests')) {
            ./Build.ps1 -Target $target
            if ($LASTEXITCODE) { throw ('WPF messaging checks failed: ' + $target) }
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: messaging-ui-${{ matrix.os }}
          path: |
            work/im-ui-*/channels*.png
            work/feature-navigation/native-*/channels*.png
          if-no-files-found: ignore
