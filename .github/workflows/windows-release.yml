name: Verify published DeskPet shipping assets
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Read-only draft upgrade verification or public download verification
        required: true
        default: draft
        type: choice
        options: [draft, public]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    # GitHub restricts draft release visibility to callers with push access.
    # The verifier itself performs GET requests only; it never publishes or edits.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: verification
          sparse-checkout: .github/shipping-verifier
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: v1.0.4-dev.2
          path: source
          sparse-checkout: tests
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify shipping assets and immutable release boundaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_PHASE: ${{ inputs.phase }}
        run: |
          python -X utf8 verification/.github/shipping-verifier/verify-shipping.py --phase $env:VERIFY_PHASE --source source --reports reports
          if ($LASTEXITCODE) { throw 'Shipping verification failed' }
      - name: Preserve small verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shipping-verification-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            reports/*.json
            reports/*.log
